name: Update policy database

on:
  schedule:
    - cron: "12 19 * * *" # 04:12 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update policies
        env:
          YOUTH_POLICY_API_KEY: ${{ secrets.YOUTH_POLICY_API_KEY }}
          YOUTH_POLICY_MAX_PAGES: "10"
          YOUTH_POLICY_PAGE_SIZE: "100"
        run: node tools/update-policies.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- data/policies.json data/policies.js data/update-report.json; then
            echo "No policy changes"
            exit 0
          fi
          git config user.name "policy-board-bot"
          git config user.email "policy-board-bot@users.noreply.github.com"
          git add data/policies.json data/policies.js data/update-report.json
          git commit -m "Update policy database"
          git push
